name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No "3.x": actions/setup-python resolves it to 3.14.x, which doesn't satisfy
        # `requires-python = ">=3.15"` in pyproject.toml, so `uv sync` refuses to use it.
        python-version: ["3.15.1"]

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Use the Python installed above for every uv command
        run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Set up git config attributes
        run: |
          git config --global user.email "first.last@example.com"
          git config --global user.name "First Last"
          git config --global init.defaultBranch main
          git config --global push.autoSetupRemote true

      - name: Run unit tests
        run: uv run pytest -vv
