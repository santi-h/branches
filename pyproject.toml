[project]
name = "branches"
dynamic = ["version"]
requires-python = ">=3.15"
dependencies = [
    "gitpython>=3.2.1",
    "pydash>=8.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "urllib3>=2.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint]
ignore = ["FLY002"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-httpserver>=1.2.0",
    "ruff>=0.17.2",
]
